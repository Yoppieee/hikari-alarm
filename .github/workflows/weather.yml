name: 天気データの取得
on:
  schedule:
    # 毎時(GitHubの定時実行は遅れたり飛んだりするため、回数で補う)。中身が変わったときだけコミットする
    - cron: "7 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: weather
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/fetch_weather.py
      - name: commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jma
          # 取得時刻以外に変化がなければコミットしない(気象庁の更新は1日数回)
          if git diff --cached --quiet -- . ':!data/jma/fetched_at.txt'; then exit 0; fi
          git commit -m "天気データを更新"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && break; sleep 5; done
