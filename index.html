<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="光アラーム">
<meta name="theme-color" content="#000000">
<title>光アラーム</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chivo+Mono:wght@200;400;500&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* 黒とオレンジ。グラデーションなしのフラット。操作できるもの・選択中・光をオレンジに */
:root{
  --night:#000000; --panel:#0e0e10; --raise:#1c1c1f; --line:#232327;
  --ink:#f2efe9; --mute:#8b8792; --faint:#4a4752;
  --ember:#ff8a1f; --ember-dim:#3a2210;
  --digit:"Chivo Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --body:"Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--night);color:var(--ink);font:14px/1.6 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:calc(18px + env(safe-area-inset-top,0px)) calc(28px + env(safe-area-inset-bottom,0px));
  -webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
.wrap{max-width:430px;margin:0 auto;display:flex;flex-direction:column;gap:16px}

header{display:flex;align-items:baseline;justify-content:space-between}
h1{margin:0;font-size:13px;font-weight:700;letter-spacing:.32em;color:var(--ember)}
.now{font:400 12px var(--digit);color:var(--faint);font-variant-numeric:tabular-nums}

/* 時刻のステージ */
.stage{border-radius:24px;background:var(--panel);padding:22px 20px 24px;display:flex;flex-direction:column;gap:6px}
.days{display:flex;gap:6px;align-self:center;background:var(--night);border:1px solid var(--line);border-radius:999px;padding:3px}
.chip{border:0;background:transparent;color:var(--mute);border-radius:999px;padding:6px 18px;font:500 13px var(--body);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ember);color:var(--night)}
#t{appearance:none;-webkit-appearance:none;border:0;background:transparent;color:var(--ink);
  font:200 clamp(78px,26vw,112px)/1.05 var(--digit);text-align:center;width:100%;padding:6px 0 0;
  letter-spacing:-.04em;font-variant-numeric:tabular-nums;cursor:pointer}
#t::-webkit-date-and-time-value{text-align:center}
#t::-webkit-calendar-picker-indicator{display:none}
.datel{text-align:center;color:var(--mute);font-size:13px;letter-spacing:.12em}

/* 設定 */
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{background:var(--panel);border-radius:20px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.lab{font-size:11px;color:var(--ember);letter-spacing:.24em;padding-left:4px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.seg button{border:1px solid transparent;background:var(--raise);color:var(--mute);border-radius:12px;padding:9px 0;
  font:500 15px var(--digit);cursor:pointer;font-variant-numeric:tabular-nums}
.seg button small{font:400 10px var(--body);margin-left:1px}
.seg button[aria-pressed="true"]{color:var(--night);background:var(--ember)}
.seg button:disabled{opacity:.3;cursor:default}

/* タイムライン */
.plan{background:var(--panel);border-radius:20px;padding:16px 18px 18px}
.plan .lab{display:block;margin-bottom:12px}
.track{position:relative;display:flex;flex-direction:column;gap:12px;padding-left:22px}
.track::before{content:"";position:absolute;left:5px;top:8px;bottom:8px;width:1px;background:var(--ember-dim)}
.step{position:relative;display:flex;align-items:baseline;gap:12px}
.step::before{content:"";position:absolute;left:-21px;top:50%;width:9px;height:9px;margin-top:-4px;border-radius:50%;
  background:var(--night);border:1.5px solid var(--faint)}
.step.light::before{background:var(--ember);border-color:var(--ember)}
.step.ring::before{border-color:var(--ember)}
.step .tm{font:500 19px var(--digit);font-variant-numeric:tabular-nums;min-width:4.2em}
.step.light .tm{color:var(--ember)}
.step .what{font-size:12px;color:var(--mute)}

/* セット */
.go{display:block;text-align:center;text-decoration:none;border-radius:20px;padding:18px 0;
  font:700 17px var(--body);letter-spacing:.4em;text-indent:.4em;color:var(--night);background:var(--ember)}
.go:active{transform:translateY(1px) scale(.995)}
.note{margin:0;font-size:11.5px;color:var(--faint);line-height:1.8}

button:focus-visible,#t:focus-visible,.go:focus-visible{outline:2px solid var(--ember);outline-offset:3px}
@media (prefers-reduced-motion:reduce){.go:active{transform:none}}
@media (max-width:360px){.opts{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>光アラーム</h1>
    <span class="now" id="now">07:54</span>
  </header>

  <section class="stage" aria-label="1回目の時刻">
    <div class="days" role="group" aria-label="日付">
      <button class="chip" id="d0" type="button" aria-pressed="false">今日</button>
      <button class="chip" id="d1" type="button" aria-pressed="true">明日</button>
    </div>
    <input id="t" type="time" value="08:00" step="300" aria-label="1回目の時刻">
    <div class="datel" id="datel">10月29日(木)</div>
  </section>

  <div class="opts">
    <div class="opt">
      <span class="lab">回数</span>
      <div class="seg" id="cnt" role="group" aria-label="回数">
        <button type="button" data-v="1">1</button>
        <button type="button" data-v="2">2</button>
        <button type="button" data-v="3" aria-pressed="true">3</button>
      </div>
    </div>
    <div class="opt">
      <span class="lab">間隔(分)</span>
      <div class="seg" id="gap" role="group" aria-label="間隔">
        <button type="button" data-v="5">5</button>
        <button type="button" data-v="10" aria-pressed="true">10</button>
        <button type="button" data-v="15">15</button>
      </div>
    </div>
  </div>

  <section class="plan" aria-live="polite">
    <span class="lab">朝の流れ</span>
    <div class="track" id="track">
      <div class="step light"><span class="tm">7:50</span><span class="what">暖色でふわっと点灯</span></div>
      <div class="step ring"><span class="tm">8:00</span><span class="what">アラーム1・光が最大に</span></div>
    </div>
  </section>

  <a class="go" id="go" href="#">セット</a>

  <p class="note">セットでショートカット「光アラームセット(手動)」が起動し、Googleカレンダーへの予定追加、アラーム、光の予約までまとめて行います。外出先でセットした場合、光の予約は帰宅後、夜中3:00の自動実行で入ります。</p>
</div>

<script>
(function(){
  const SC = "光アラームセット(手動)";
  const W = ["日","月","火","水","木","金","土"];
  const $ = id => document.getElementById(id);
  const t = $("t"), d0 = $("d0"), d1 = $("d1");
  const state = {day:1, count:3, gap:10};
  try{ const s = JSON.parse(localStorage.getItem("hikari-alarm")||"null");
       if(s){ state.count = s.count||3; state.gap = s.gap||10; if(s.time) t.value = s.time; } }catch(e){}

  const hm = d => d.getHours()+":"+String(d.getMinutes()).padStart(2,"0");
  const stamp = d => d.getFullYear()+"/"+(d.getMonth()+1)+"/"+d.getDate()+" "+hm(d);
  const parts = () => (t.value||"08:00").split(":").map(Number);

  function autoDay(){
    const [h,m] = parts(), d = new Date(); d.setHours(h,m,0,0);
    state.day = d > new Date() ? 0 : 1;
  }
  function pick(group, v){ group.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(+b.dataset.v === v))); }

  function render(){
    const n = new Date(); $("now").textContent = String(n.getHours()).padStart(2,"0")+":"+String(n.getMinutes()).padStart(2,"0");
    d0.setAttribute("aria-pressed", String(state.day===0));
    d1.setAttribute("aria-pressed", String(state.day===1));
    pick($("cnt"), state.count); pick($("gap"), state.gap);
    $("gap").querySelectorAll("button").forEach(b => b.disabled = state.count===1);

    const [h,m] = parts(), b = new Date(); b.setSeconds(0,0); b.setHours(h,m); b.setDate(b.getDate()+state.day);
    $("datel").textContent = (b.getMonth()+1)+"月"+b.getDate()+"日("+W[b.getDay()]+")";
    const times = [];
    for(let i=0;i<state.count;i++){ const x = new Date(b); x.setMinutes(x.getMinutes()+i*state.gap); times.push(x); }
    const ls = new Date(b); ls.setMinutes(ls.getMinutes()-10);

    let html = '<div class="step light"><span class="tm">'+hm(ls)+'</span><span class="what">暖色でふわっと点灯</span></div>';
    times.forEach((x,i) => {
      html += '<div class="step ring"><span class="tm">'+hm(x)+'</span><span class="what">アラーム'+(i+1)+(i===0?'・光が最大に':'')+'</span></div>';
    });
    $("track").innerHTML = html;

    $("go").href = "shortcuts://run-shortcut?name="+encodeURIComponent(SC)+"&input=text&text="+encodeURIComponent(times.map(stamp).join(","));
    try{ localStorage.setItem("hikari-alarm", JSON.stringify({count:state.count,gap:state.gap,time:t.value})); }catch(e){}
  }

  t.addEventListener("input", () => { autoDay(); render(); });
  d0.addEventListener("click", () => { state.day=0; render(); });
  d1.addEventListener("click", () => { state.day=1; render(); });
  $("cnt").addEventListener("click", e => { const b=e.target.closest("button"); if(b){ state.count=+b.dataset.v; render(); }});
  $("gap").addEventListener("click", e => { const b=e.target.closest("button"); if(b && !b.disabled){ state.gap=+b.dataset.v; render(); }});
  document.addEventListener("visibilitychange", () => { if(!document.hidden){ autoDay(); render(); } });

  autoDay(); render();
})();
</script>
</body>
</html>
